<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DM Companion</title>
    <script>
      // Apply the theme before first paint so there is no flash. The saved setting lives in Rust
      // (settings.json); localStorage is only a cache of it, kept by src/lib/stores/theme.svelte.ts.
      (function () {
        var pref = "system";
        try {
          pref = localStorage.getItem("theme") || "system";
        } catch (e) {}
        var dark = pref === "dark" || (pref === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        var motion = "system";
        try {
          motion = localStorage.getItem("animations") || "system";
        } catch (e) {}
        var reduce = motion === "off" || (motion === "system" && matchMedia("(prefers-reduced-motion: reduce)").matches);
        document.documentElement.dataset.motion = reduce ? "reduce" : "full";
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
